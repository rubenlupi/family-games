<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Games</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>🎲 Family Games</h1>
      <p>Elige un juego y ¡a jugar!</p>
    </header>

    <section class="games">
      <a class="game-card" href="games/reverse-words/" style="--accent: var(--c-reverse)">
        <span class="icon">🔄</span>
        <h2>Reverse Words</h2>
        <p>Palabras al revés: ¿quién las descifra antes?</p>
        <span class="play">Jugar</span>
      </a>

      <a class="game-card" href="games/impostor/" style="--accent: var(--c-impostor)">
        <span class="icon">🕵️</span>
        <h2>El Impostor</h2>
        <p>Todos conocen la palabra… menos uno. Descubre al impostor.</p>
        <span class="play">Jugar</span>
      </a>

      <a class="game-card" href="games/cripticos/" style="--accent: var(--c-cripticos)">
        <span class="icon">🧩</span>
        <h2>Crípticos</h2>
        <p>Pistas crípticas para mentes retorcidas.</p>
        <span class="play">Jugar</span>
      </a>
    </section>
  </main>
</body>
</html>
