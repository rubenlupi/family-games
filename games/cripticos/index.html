<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crípticos · Family Games</title>
  <link rel="stylesheet" href="../../assets/styles.css">
  <link rel="stylesheet" href="cripticos.css">
</head>
<body data-game="cripticos">
  <main class="page narrow" style="--accent: var(--c-cripticos)">
    <div class="topbar">
      <a class="back" href="../../" data-i18n="back">← Volver al panel</a>
      <div class="tools"></div>
    </div>
    <header>
      <h1 data-i18n="title">🧩 Crípticos</h1>
    </header>

    <nav class="clue-nav">
      <button class="btn ghost" id="prev" type="button" aria-label="Pista anterior" data-i18n-aria="prev">‹</button>
      <span id="counter"></span>
      <button class="btn ghost" id="next" type="button" aria-label="Pista siguiente" data-i18n-aria="next">›</button>
      <button class="btn ghost" id="random" type="button" aria-label="Pista sin resolver al azar" data-i18n-aria="random">🔀</button>
    </nav>

    <div class="card clue-card">
      <p class="clue" id="clue"></p>
      <p class="clue-type hidden" id="clue-type"></p>
      <div class="boxes" id="boxes"></div>
      <p class="message" id="message" aria-live="polite"></p>
      <p class="explanation hidden" id="explanation"></p>

      <div class="actions" id="actions">
        <button class="btn ghost" id="hints-toggle" type="button" data-i18n="hints">💡 Pistas</button>
        <button class="btn" id="check" type="button" data-i18n="check">Revisar</button>
      </div>

      <div class="hint-menu hidden" id="hint-menu">
        <button class="btn ghost" data-hint="definition" type="button" data-i18n="hint.definition">Marcar la definición</button>
        <button class="btn ghost" data-hint="type" type="button" data-i18n="hint.type">Tipo de juego</button>
        <button class="btn ghost" data-hint="letter" type="button" data-i18n="hint.letter">Revelar una letra</button>
        <button class="btn ghost" data-hint="solution" type="button" data-i18n="hint.solution">Ver solución</button>
      </div>

      <button class="btn big hidden" id="go-next" type="button" data-i18n="go-next">Siguiente pista →</button>
    </div>

    <div class="keyboard" id="keyboard"></div>
  </main>

  <script src="../../assets/i18n.js"></script>
  <script src="clues.js"></script>
  <script src="clues-en.js"></script>
  <script src="cripticos.js"></script>
</body>
</html>
